name: Create Version Tag

on:
  workflow_run:
    workflows: ["Build and Cache"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-tag:
    # The branch filter above matches the head branch of the triggering run, so a
    # fork pull request opened from a branch named main would also arrive here.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only eligible tag jobs share the queue; failed builds must not displace them.
    concurrency:
      group: create-version-tag
      cancel-in-progress: false
      # Preserve pending releases instead of replacing the previous pending job.
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Extract version from package.nix
        id: version
        run: |
          VERSION=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' package.nix | head -1)
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.nix does not declare a release version: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check-tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push version tag
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Extract major version
        id: major
        run: |
          MAJOR=$(echo "${{ steps.version.outputs.version }}" | cut -d. -f1)
          echo "major=$MAJOR" >> $GITHUB_OUTPUT

      - name: Update moving tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        # A rerun of a build that predates the helper checks out a commit without
        # it, so the helper always comes from the revision of this workflow.
        run: |
          git show "$WORKFLOW_SHA:scripts/update-moving-tags.sh" > "$RUNNER_TEMP/update-moving-tags.sh"
          bash "$RUNNER_TEMP/update-moving-tags.sh" "$VERSION"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR: ${{ steps.major.outputs.major }}
          TAG_EXISTS: ${{ steps.check-tag.outputs.exists }}
        run: |
          HEAD_COMMIT=$(git rev-parse HEAD)
          {
            echo "## Tag Summary"
            echo ""
            echo "| Tag | Points To |"
            echo "|-----|-----------|"
            if [ "$TAG_EXISTS" == "false" ]; then
              echo "| v$VERSION | ${HEAD_COMMIT:0:7} |"
            else
              echo "| v$VERSION | (already exists) |"
            fi
            # The helper leaves a moving tag on a newer release when an older build
            # reruns, so report where each tag points on GitHub.
            for tag in "v$MAJOR" latest; do
              published_commit=$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)
              if [ "$published_commit" == "$HEAD_COMMIT" ]; then
                echo "| $tag | v$VERSION |"
              else
                echo "| $tag | ${published_commit:0:7} (newer release, unchanged) |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
