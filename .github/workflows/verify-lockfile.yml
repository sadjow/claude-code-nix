name: Verify Action Lockfile

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  schedule:
    # Reports release tags that moved upstream after they were locked.
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify actions.lock
        run: gh actions-lock --verify
